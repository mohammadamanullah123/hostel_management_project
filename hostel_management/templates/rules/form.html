{% extends 'base.html' %}
{% block title %}{{ form_title }} — HostelPro{% endblock %}

{% block content %}
<div class="container mt-4">

    <!-- Page Header -->
    <div class="page-header">
        <h2>
            <i class="bi bi-shield-{% if rule %}exclamation{% else %}plus{% endif %} me-2" style="color:#fbbf24;"></i>
            {{ form_title }}
        </h2>
        <a href="{% url 'rules_list' %}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back to Rules
        </a>
    </div>

    <!-- Form Card -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-card">
                <form method="post" id="rule-form">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="rule_text" class="form-label">Rule Text <span style="color:#f87171;">*</span></label>
                        <textarea class="form-control" id="rule_text" name="rule_text" rows="5"
                                  placeholder="Enter the hostel rule or guideline..." required
                                  style="resize:vertical;min-height:120px;">{% if rule %}{{ rule.rule_text }}{% elif form_data %}{{ form_data.rule_text }}{% endif %}</textarea>
                    </div>

                    <hr style="border-color:var(--border-glass);margin:1.5rem 0;">

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'rules_list' %}" class="btn btn-outline-light">Cancel</a>
                        <button type="submit" class="btn btn-primary" id="rule-submit-btn">
                            <i class="bi bi-check-circle me-1"></i>
                            {% if rule %}Update Rule{% else %}Add Rule{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
{% endblock %}
