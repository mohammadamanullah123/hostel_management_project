{% extends 'base.html' %}
{% block title %}Delete Rule — HostelPro{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="glass-card confirm-delete-card">
        <div class="delete-icon">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h4 class="mb-2">Delete Rule</h4>
        <p class="text-muted mb-3">Are you sure you want to delete this rule?</p>
        <div class="glass-card" style="text-align:left;margin-bottom:1.5rem;padding:1rem 1.25rem;">
            <p class="mb-0" style="line-height:1.6;">{{ rule.rule_text }}</p>
        </div>
        <p class="text-muted" style="font-size:0.8rem;">
            <i class="bi bi-exclamation-circle me-1"></i>
            This action cannot be undone.
        </p>

        <div class="d-flex justify-content-center gap-2 mt-3">
            <a href="{% url 'rules_list' %}" class="btn btn-outline-light">
                <i class="bi bi-x-lg me-1"></i> Cancel
            </a>
            <form method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger" id="confirm-delete-btn">
                    <i class="bi bi-trash-fill me-1"></i> Delete Rule
                </button>
            </form>
        </div>
    </div>

</div>
{% endblock %}
